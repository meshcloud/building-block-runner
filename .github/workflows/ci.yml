name: CI

env:
  REGISTRY: ghcr.io
  DOCKERHUB_REGISTRY: docker.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}
  CGO_ENABLED: "0" # like the images, so building needs no C compiler
  # A pull_request run can also see github.ref == refs/heads/main, e.g. when the PR merges by a push.
  PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  # Dev deploys whatever SHA is main HEAD, so every push to main must get its images.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  jvm-runners-ci:
    name: ${{ matrix.name }} - check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: block-runner-core
            gradle-task: :block-runner-core:check
          - name: github-block-runner
            gradle-task: :github-block-runner:check
          - name: gitlab-block-runner
            gradle-task: :gitlab-block-runner:check
          - name: azure-devops-block-runner
            gradle-task: :azure-devops-block-runner:check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Run module check
        run: ./gradlew ${{ matrix.gradle-task }}

  # One job for PRs and main so the matrix always expands (no skipped jobs with unresolved
  # ${{ matrix.* }} names). PRs only build (never push) to validate the Dockerfile; main pushes the
  # floating :main tag. The git-describe version is baked into every build via the VERSION build-arg;
  # the release workflow owns the immutable :<version> + :latest tags.
  jvm-runners-image:
    name: ${{ matrix.image }} - image
    runs-on: ubuntu-latest
    needs: jvm-runners-ci
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: github-block-runner
            module: github-block-runner
          - image: gitlab-block-runner
            module: gitlab-block-runner
          - image: azure-devops-block-runner
            module: azure-devops-block-runner

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0      # full history + tags so `git describe` can derive the version

      - name: Resolve version and image tags
        id: meta
        shell: bash
        env:
          IMAGE: ${{ matrix.image }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # git describe -> e.g. v1.0.0 on a release commit, v1.0.0-10-g6ccdaf8 on commits after it.
          VERSION="$(git describe --tags --always)"
          echo "resolved version: ${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          img="${REGISTRY}/${IMAGE_NAMESPACE}/${IMAGE}"
          hub="${DOCKERHUB_REGISTRY}/${IMAGE_NAMESPACE}/${IMAGE}"
          {
            echo "tags<<EOF"
            if [ "$PUBLISH" = "true" ]; then
              # main pushes the floating :main tag plus the immutable :<sha> tag — meshcloud dev pins
              # run-controller (and others) to a specific image SHA. The git-describe version is still
              # baked into the binary via the VERSION build-arg below.
              echo "${img}:main"
              echo "${img}:${GITHUB_SHA}"
              echo "${hub}:main"
              echo "${hub}:${GITHUB_SHA}"
            else
              # PRs build but never push (see `push:` below); a local buildx tag name only.
              echo "${img}:pr-${PR_NUMBER}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        if: github.repository_owner == 'meshcloud' && env.PUBLISH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: github.repository_owner == 'meshcloud' && env.PUBLISH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.DOCKERHUB_REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push JVM runner image
        if: github.repository_owner == 'meshcloud'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: containers/jvm.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            RUNNER_MODULE=${{ matrix.module }}
            VERSION=${{ steps.meta.outputs.version }}

  go-runners-ci:
    name: go - test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Check that go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --compact-summary --exit-code -- go.mod go.sum || \
            (echo "::error::go mod tidy changed go.mod or go.sum. Run 'task tidy' and commit the result."; exit 1)

      - name: Check for known vulnerabilities
        run: go tool govulncheck -tags inprocess ./...

      # Built here rather than downloaded by the action below: golangci-lint's formatters use the
      # go/format compiled into the binary, so the formatting they enforce comes from the Go release
      # that built the linter. The tool directive in go.mod is the single pin.
      - name: Build the pinned golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # The step above already installed it; the action is here for the annotations it puts on
          # the pull request diff, which a bare `run:` does not produce.
          install-mode: none
          args: --build-tags inprocess

      # Binary coverage data (GOCOVERDIR format) rather than a text profile, because only the binary
      # form merges with the acceptance run's coverage. `-coverpkg=./...` matches what meshfed-release
      # instruments, so both figures share one denominator.
      - name: Test
        run: |
          mkdir -p covdata/unit
          go test -race -tags inprocess -coverpkg=./... ./... -args -test.gocoverdir="$PWD/covdata/unit"
        env:
          CGO_ENABLED: "1" # the race detector needs cgo

      - name: Test against Keycloak
        run: go test -tags keycloak -count=1 -run Test_Keycloak ./run-controller/keycloakwif/

      # meshfed-release's satellite coverage finds this by the commit sha and merges it with the
      # acceptance run's coverage. The contract is the artifact name `covdata-unit` and
      # covmeta.*/covcounters.* at its root, which naming the directory gives and a glob would nest.
      - name: Upload unit coverage data
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: covdata-unit
          path: covdata/unit
          retention-days: 3

  # One job for PRs and main (see jvm-runners-image for the rationale): the matrix always expands, so
  # there are no skipped jobs with unresolved ${{ matrix.* }} names. PRs only build (never push);
  # main pushes the floating :main tag; the git-describe version is baked via -ldflags build.Version.
  go-runners-image:
    name: ${{ matrix.app }} - image
    runs-on: ubuntu-latest
    needs: go-runners-ci
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: manual-block-runner
            dockerfile: manual-block-runner/Dockerfile
          - app: run-controller
            dockerfile: run-controller/Dockerfile
          - app: tf-block-runner
            dockerfile: tf-block-runner/Dockerfile

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0      # full history + tags so `git describe` can derive the version

      - name: Resolve version and image tags
        id: meta
        shell: bash
        env:
          IMAGE: ${{ matrix.app }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # git describe -> e.g. v1.0.0 on a release commit, v1.0.0-10-g6ccdaf8 on commits after it.
          VERSION="$(git describe --tags --always)"
          echo "resolved version: ${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          img="${REGISTRY}/${IMAGE_NAMESPACE}/${IMAGE}"
          hub="${DOCKERHUB_REGISTRY}/${IMAGE_NAMESPACE}/${IMAGE}"
          {
            echo "tags<<EOF"
            if [ "$PUBLISH" = "true" ]; then
              # main pushes the floating :main tag plus the immutable :<sha> tag — meshcloud dev pins
              # run-controller (and others) to a specific image SHA. The git-describe version is still
              # baked into the binary via the VERSION build-arg below.
              echo "${img}:main"
              echo "${img}:${GITHUB_SHA}"
              echo "${hub}:main"
              echo "${hub}:${GITHUB_SHA}"
            else
              # PRs build but never push (see `push:` below); a local buildx tag name only.
              echo "${img}:pr-${PR_NUMBER}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        if: github.repository_owner == 'meshcloud' && env.PUBLISH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: github.repository_owner == 'meshcloud' && env.PUBLISH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.DOCKERHUB_REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        if: github.repository_owner == 'meshcloud'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
