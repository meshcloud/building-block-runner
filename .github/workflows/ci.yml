name: CI

env:
  REGISTRY: ghcr.io
  DOCKERHUB_REGISTRY: docker.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}
  CGO_ENABLED: "0" # like the images, so building needs no C compiler

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-runners-ci:
    name: go - test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        run: |
          for tags in '' k8s tf manual gitlab azuredevops github; do
            go build -tags "$tags" ./...
          done
          for goos in darwin windows; do
            GOOS="$goos" go build ./...
          done

      # golangci-lint's formatters use the go/format compiled into the binary, so this step builds
      # it with the Go of go.mod. The tool directive in go.mod is the single pin.
      - name: Build the pinned golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # The step above already installed it; the action is here for the annotations it puts on
          # the pull request diff, which a bare `run:` does not produce.
          install-mode: none

      - name: Lint with the k8s tag
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          install-mode: none
          args: --build-tags k8s

      - name: Lint with the tf tag
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          install-mode: none
          args: --build-tags tf

      - name: Lint with the manual tag
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          install-mode: none
          args: --build-tags manual

      - name: Lint with the gitlab tag
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          install-mode: none
          args: --build-tags gitlab

      - name: Lint with the azuredevops tag
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          install-mode: none
          args: --build-tags azuredevops

      - name: Lint with the github tag
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          install-mode: none
          args: --build-tags github

      - name: Suggest fix command on failure
        if: failure()
        run: |
          echo "::error::Linting or formatting issues detected. Run 'task lint -- --fix' locally to automatically fix these issues, then commit the changes."

      # Only the GOCOVERDIR format merges with the acceptance run's coverage. `-coverpkg=./...`
      # matches what meshfed-release instruments, so both figures share one denominator.
      - name: Test
        run: |
          mkdir -p covdata/unit
          for tags in '' k8s tf manual gitlab azuredevops github; do
            go test -race -tags "$tags" -coverpkg=./... ./... -args -test.gocoverdir="$PWD/covdata/unit"
          done
        env:
          CGO_ENABLED: "1" # the race detector needs cgo

      # meshfed-release's satellite coverage finds this by the commit sha and merges it with the
      # acceptance run's coverage. The contract is the artifact name `covdata-unit` and
      # covmeta.*/covcounters.* at its root, which naming the directory gives and a glob would nest.
      - name: Upload unit coverage data
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: covdata-unit
          path: covdata/unit
          retention-days: 3

  # One job for PRs and main, so the matrix always expands and no job is skipped with an unresolved
  # ${{ matrix.* }} name. PRs only build; main pushes :main, and releases push in build-images.yml.
  go-runners-image:
    name: ${{ matrix.app }} - image
    runs-on: ubuntu-latest
    needs: go-runners-ci
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: manual-block-runner
            target: runner
            tags: manual
            for_types: manual
          - app: github-block-runner
            target: runner
            tags: github
            for_types: github
          - app: gitlab-block-runner
            target: runner
            tags: gitlab
            for_types: gitlab
          - app: azure-devops-block-runner
            target: runner
            tags: azuredevops
            for_types: azuredevops
          - app: run-controller
            target: runner
            tags: k8s
          - app: tf-block-runner
            target: tf
            tags: tf
            for_types: tf
          - app: building-block-runner
            target: tf
            tags: ""

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # go build derives the version from the tags

      - name: Resolve image tags
        id: meta
        shell: bash
        env:
          IMAGE: ${{ matrix.app }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          img="${REGISTRY}/${IMAGE_NAMESPACE}/${IMAGE}"
          hub="${DOCKERHUB_REGISTRY}/${IMAGE_NAMESPACE}/${IMAGE}"
          {
            echo "tags<<EOF"
            if [ "$GITHUB_REF" = "refs/heads/main" ]; then
              # meshcloud dev pins the images by commit sha.
              echo "${img}:main"
              echo "${img}:${GITHUB_SHA}"
              echo "${hub}:main"
              echo "${hub}:${GITHUB_SHA}"
            else
              echo "${img}:pr-${PR_NUMBER}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        if: github.repository_owner == 'meshcloud' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: github.repository_owner == 'meshcloud' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.DOCKERHUB_REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        if: github.repository_owner == 'meshcloud'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: containers/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            TAGS=${{ matrix.tags }}
            FOR_TYPES=${{ matrix.for_types }}
