name: Dependency Submission

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**/gradle.lockfile'
      - '.github/workflows/dependency-submission.yml'

concurrency:
  group: dependency-submission
  cancel-in-progress: true

jobs:
  gradle:
    # Dependabot reads only the default branch's graph.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: write # Dependency Submission API

    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Submit the shipped Gradle dependencies
        uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          # The graph cannot mark a Gradle package as test-only.
          dependency-graph-include-configurations: productionRuntimeClasspath
