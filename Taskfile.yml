version: '3'

vars:
  PACKAGES: ./...

env:
  CGO_ENABLED: "0" # like the images, so building needs no C compiler

tasks:
  default:
    cmds:
      - task --list

  test:
    desc: Run the Go tests with and without the k8s tag. Set PACKAGES to test fewer.
    env:
      CGO_ENABLED: "1" # the race detector needs cgo
    cmds:
      - go test -race {{.CLI_ARGS}} {{.PACKAGES}}
      - go test -race -tags k8s {{.CLI_ARGS}} {{.PACKAGES}}

  lint:
    desc: Run golangci-lint with and without the k8s tag. Set PACKAGES to lint fewer, `-- --fix` to fix.
    cmds:
      - 'go tool golangci-lint run {{.CLI_ARGS}} {{.PACKAGES}}'
      - 'go tool golangci-lint run --build-tags k8s {{.CLI_ARGS}} {{.PACKAGES}}'

  fmt:
    desc: Format the Go code
    cmds:
      - 'go tool golangci-lint fmt ./...'

  tidy:
    desc: Tidy go.mod and go.sum
    cmds:
      - go mod tidy

  start:runner:
    # The goal is to support every run type in process.
    desc: Run the ALL runner from source. Currently supports TERRAFORM and MANUAL and fails other runs immediately.
    env:
      RUNNER_CONFIG_FILE: run-controller/local/runner-config.yml
    vars:
      COVER_ARGS: '{{if .GOCOVERDIR}}-cover -coverpkg=./...{{end}}'
    cmds:
      - go build {{.COVER_ARGS}} -o bin/run-controller ./run-controller
      - bin/run-controller {{.CLI_ARGS}}
