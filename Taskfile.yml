version: '3'

vars:
  PACKAGES: ./...

env:
  CGO_ENABLED: "0" # like the images, so building needs no C compiler

tasks:
  default:
    cmds:
      - task --list

  test:
    desc: Run the Go tests
    summary: |
      Pass PACKAGES to test fewer packages, e.g. `task test PACKAGES=./run-controller/...`.
      Arguments after `--` go to `go test`.
    env:
      CGO_ENABLED: "1" # the race detector needs cgo
    cmds:
      - go test -race {{.CLI_ARGS}} {{.PACKAGES}}

  lint:
    desc: Run golangci-lint, including the format check
    summary: |
      Pass PACKAGES to lint fewer packages. `task lint -- --fix` fixes what it can.
    cmds:
      - 'go tool golangci-lint run {{.CLI_ARGS}} {{.PACKAGES}}'

  fmt:
    desc: Format the Go code
    cmds:
      - 'go tool golangci-lint fmt ./...'

  tidy:
    desc: Tidy go.mod and go.sum
    cmds:
      - go mod tidy

  start:run-controller:
    desc: Run run-controller from source
    env:
      RUNCONTROLLER_CONFIG_FILE: run-controller/runner-config.yml
    cmds:
      - go run ./run-controller {{.CLI_ARGS}}

  start:manual-block-runner:
    desc: Run manual-block-runner from source
    cmds:
      - go run ./manual-block-runner {{.CLI_ARGS}}

  start:tf-block-runner:
    desc: Run tf-block-runner from source
    env:
      RUNNER_CONFIG_FILE: tf-block-runner/runner-config.yml
    cmds:
      - go run ./tf-block-runner {{.CLI_ARGS}}

  acceptance-runner:
    desc: Run the runners that meshfed-release's acceptance tests use, until one of them exits
    summary: |
      meshfed-release starts this from the repository root and kills it when its tests end.
      It always exits non-zero, because a runner that exits on its own is a failure.

      Environment, all optional:
        RUNNER_API_CLIENT_ID, RUNNER_API_CLIENT_SECRET
                                     API key of every runner; without it they use basic auth
        TF_BLOCK_RUNNER_API_URL      default http://127.0.0.1:8300
        TF_BLOCK_RUNNER_PORT         default 8100, health at http://127.0.0.1:$TF_BLOCK_RUNNER_PORT/healthz
        MANUAL_BLOCK_RUNNER_API_URL  default http://127.0.0.1:8301
        MANUAL_BLOCK_RUNNER_PORT     default 8104, health at http://127.0.0.1:$MANUAL_BLOCK_RUNNER_PORT/healthz
    cmds:
      - go build -o bin/tf-block-runner ./tf-block-runner
      - go build -o bin/manual-block-runner ./manual-block-runner
      # bash, because go-task's built-in shell has no `wait -n`.
      - |
        bash -u <<'EOF'
        trap 'kill $(jobs -p) 2>/dev/null; wait' EXIT
        trap 'exit 143' INT TERM

        RUNNER_CONFIG_FILE=tf-block-runner/runner-config.yml \
        RUNNER_API_URL="${TF_BLOCK_RUNNER_API_URL:-http://127.0.0.1:8300}" \
        PORT="${TF_BLOCK_RUNNER_PORT:-8100}" \
          bin/tf-block-runner &

        RUNNER_API_URL="${MANUAL_BLOCK_RUNNER_API_URL:-http://127.0.0.1:8301}" \
        PORT="${MANUAL_BLOCK_RUNNER_PORT:-8104}" \
          bin/manual-block-runner &

        # go-task ignores a SIGTERM sent to it alone, and dies of a SIGKILL without stopping its
        # commands, so the runners stop with it.
        while kill -0 "$PPID" 2>/dev/null; do sleep 1; done &

        wait -n
        echo "acceptance-runner: a runner or go-task exited, stopping the others" >&2
        exit 1
        EOF
