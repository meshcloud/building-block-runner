version: '3'

vars:
  PACKAGES: ./...

env:
  CGO_ENABLED: "0" # like the images, so building needs no C compiler

tasks:
  default:
    cmds:
      - task --list

  test:
    desc: Run the Go tests
    summary: |
      Pass PACKAGES to test fewer packages, e.g. `task test PACKAGES=./run-controller/...`.
      Arguments after `--` go to `go test`.
    env:
      CGO_ENABLED: "1" # the race detector needs cgo
    cmds:
      - go test -race {{.CLI_ARGS}} {{.PACKAGES}}

  lint:
    desc: Run golangci-lint, including the format check
    summary: |
      Pass PACKAGES to lint fewer packages. `task lint -- --fix` fixes what it can.
    cmds:
      - 'go tool golangci-lint run {{.CLI_ARGS}} {{.PACKAGES}}'

  fmt:
    desc: Format the Go code
    cmds:
      - 'go tool golangci-lint fmt ./...'

  tidy:
    desc: Tidy go.mod and go.sum
    cmds:
      - go mod tidy

  start:run-controller:
    desc: Run run-controller from source
    env:
      RUNCONTROLLER_CONFIG_FILE: run-controller/runner-config.yml
    cmds:
      - go run ./run-controller {{.CLI_ARGS}}

  start:manual-block-runner:
    desc: Run manual-block-runner from source
    cmds:
      - go run ./manual-block-runner {{.CLI_ARGS}}

  start:tf-block-runner:
    desc: Run tf-block-runner from source
    env:
      RUNNER_CONFIG_FILE: tf-block-runner/runner-config.yml
    cmds:
      - go run ./tf-block-runner {{.CLI_ARGS}}

  acceptance-runner:
    desc: Run the in-process run-controller that meshfed-release's acceptance tests use
    summary: |
      meshfed-release starts this from the repository root and sends SIGTERM when its tests end.
      run-controller polls as the ALL runner, executes TERRAFORM and MANUAL runs in process and
      reports every other run type as FAILED. Health at http://127.0.0.1:2112/healthz.

      Environment:
        RUNNER_API_CLIENT_ID, RUNNER_API_CLIENT_SECRET
                                 API key of the ALL runner, required
        RUN_CONTROLLER_API_URL   default http://127.0.0.1:8080
        GOCOVERDIR               existing absolute directory run-controller writes binary coverage data
                                 into as it exits on SIGTERM; built with `-coverpkg=./...`, like CI's unit tests
    env:
      RUNCONTROLLER_CONFIG_FILE: run-controller/runner-config.yml
      RUNCONTROLLER_DISPATCHER: in-process
    cmds:
      - go build -cover -coverpkg=./... -o bin/run-controller ./run-controller
      - RUNNER_API_URL="${RUN_CONTROLLER_API_URL:-http://127.0.0.1:8080}" bin/run-controller
