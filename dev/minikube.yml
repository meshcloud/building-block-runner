dispatcher:
  forTypes: [ALL]
  register:
    displayName: meshcloud-hosted Runner
  maxConcurrentJobs: 20

k8s:
  namespace: default
  jobSpecTemplates:
    ALL:
      spec:
        template:
          spec:
            initContainers:
              - name: meshfed-api
                image: alpine/socat:1.8.0.3
                restartPolicy: Always
                args: ["TCP-LISTEN:8080,fork,reuseaddr,bind=127.0.0.1", "TCP:host.minikube.internal:8080"]
                resources:
                  requests:
                    cpu: 10m
                    memory: 16Mi
    # Build the :dev images into minikube first, the others like manual with their build tag from the README:
    # task image:build TARGET=tf TAGS=tf IMAGE=tf-block-runner:dev MINIKUBE=1
    # task image:build TAGS=manual IMAGE=manual-block-runner:dev MINIKUBE=1
    tf:
      spec:
        template:
          spec:
            containers:
              - name: runner
                image: tf-block-runner:dev
                imagePullPolicy: Never
    manual:
      spec:
        template:
          spec:
            containers:
              - name: runner
                image: manual-block-runner:dev
                imagePullPolicy: Never
    github:
      spec:
        template:
          spec:
            containers:
              - name: runner
                image: github-block-runner:dev
                imagePullPolicy: Never
    gitlab:
      spec:
        template:
          spec:
            containers:
              - name: runner
                image: gitlab-block-runner:dev
                imagePullPolicy: Never
    azureDevOps:
      spec:
        template:
          spec:
            containers:
              - name: runner
                image: azure-devops-block-runner:dev
                imagePullPolicy: Never
