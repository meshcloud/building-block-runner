uuid: # legacy layouts: uuid, runnerUuid, blockrunner.uuid
api:
  url: http://host.minikube.internal:8080
  auth:
    # variant 0: meshstack-cli profile, supplies url, auth and workspace which are not set here
    profile: local-dev
    workspace: admin-customer # old: ownedByWorkspace

    # variant 1: basic auth (non-bearer), needs CLI change for streamlined support
    # (old: user/password was not nested below basic)
    basic:
      username: bb-api
      password: guest

    # variant 2: apikey (old: id/secret wasn't nested)
    key:
     clientId: your-client-id
     clientSecret: your-client-secret

    # variant 3: run token, only from env RUNNER_API_AUTH_TOKEN or MESHSTACK_API_TOKEN

crypto:
  privateKeyFiles: # TODO: same-dir globbing with '*' (make it really safe)?
    - ./testdata/private-key.pem

k8s:
  namespace: default
  jobSpecTemplates:
    ALL: # or '*'
      spec:
        backoffLimit: 1
        template:
          spec:
            tolerations:
              - key: spot
                operator: Equal
                value: "true"
                effect: NoSchedule
            nodeSelector:
              spot: "true"
            containers:
              - name: runner
                env:
                  - name: LOG_LEVEL
                    value: debug
    tf:
      spec:
        template:
          spec:
            containers:
              - name: runner
                image: ghcr.io/meshcloud/tf-block-runner:main
                env:
                  - name: EXECUTION_MODE
                    value: single-run
    manual: # also MANUAL should work for backwards compat
      spec:
        template:
          spec:
            containers:
              - name: runner
                image: ghcr.io/meshcloud/manual-block-runner:main
                env:
                  - name: SPRING_PROFILES_ACTIVE
                    value: kubernetes
    github:
      spec:
        template:
          spec:
            containers:
              - name: runner
                image: ghcr.io/meshcloud/github-block-runner:main
                env:
                  - name: SPRING_PROFILES_ACTIVE
                    value: kubernetes
    gitlab:
      spec:
        template:
          spec:
            containers:
              - name: runner
                image: ghcr.io/meshcloud/gitlab-block-runner:main
                env:
                  - name: SPRING_PROFILES_ACTIVE
                    value: kubernetes
    azureDevOps:
      spec:
        template:
          spec:
            containers:
              - name: runner
                image: ghcr.io/meshcloud/azure-devops-block-runner:main
                env:
                  - name: SPRING_PROFILES_ACTIVE
                    value: kubernetes

dispatcher:
  # exactly one of tf, manual, github, gitlab, azureDevOps, ALL / '*', also the names of the meshStack API like TERRAFORM
  forTypes: [ALL]
  register: # updates the registration in meshStack on start, needs api.auth.workspace or api.auth.profile
    displayName: meshcloud-hosted Runner
  pollingInterval: 10s # time.Duration or seconds, pollingIntervalSeconds in the legacy layout
  maxConcurrentJobs: 20
  timeout: 45m # deadline of a run, timeoutMins in the legacy tf layout

tf:
  wsTimeout: 5m # terraform workspace?
  initTimeout: 3m # tofu init?
  workingDir: /tmp/runner/wd
  installDir: /tmp/runner/tfbin
  insecureHostKeys: false
