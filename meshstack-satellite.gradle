plugins {
  id 'io.meshcloud.meshstack.go-satellite'
}

satellite {
  service('runners') {
    command 'task', 'start:runner'
    environment RUNNER_API_CLIENT_ID: fromBackendConfig('auth.openid.apiKeys.meshcloud-hosted-runner.clientId'),
                RUNNER_API_CLIENT_SECRET: fromBackendConfig('auth.openid.apiKeys.meshcloud-hosted-runner.clientSecret'),
                GOCOVERDIR: coverageDir()
    health 'http://127.0.0.1:2112/healthz'
    // The task compiles the runner first, and a cold go build cache takes minutes.
    startupMinutes = 10
    files 'Taskfile.yml', 'dev/**'
  }

  acceptance {
    run = 'TestAcc'
    services 'meshfed-api', 'block-coordinator-api'
    environment BUILDING_BLOCK_RUNNER_TEST_ACC: '1',
                MESHSTACK_API_KEY: fromBackendConfig('auth.openid.apiKeys.terraform-provider-acceptance.clientId'),
                MESHSTACK_API_SECRET: fromBackendConfig('auth.openid.apiKeys.terraform-provider-acceptance.clientSecret'),
                RUNNER_API_CLIENT_ID: fromBackendConfig('auth.openid.apiKeys.meshcloud-hosted-runner.clientId'),
                RUNNER_API_CLIENT_SECRET: fromBackendConfig('auth.openid.apiKeys.meshcloud-hosted-runner.clientSecret'),
                KEYCLOAK_ADMIN_URL: fromBackendConfig('cloud.keycloak.endpoint'),
                KEYCLOAK_ADMIN_USERNAME: fromBackendConfig('cloud.keycloak.username'),
                KEYCLOAK_ADMIN_PASSWORD: fromBackendConfig('cloud.keycloak.password')
  }
}
