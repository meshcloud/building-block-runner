sonar.projectKey=meshcloud_building-block-runner
sonar.organization=meshcloud

sonar.sources=.
sonar.tests=.
sonar.test.inclusions=\
  **/*_test.go
# A file is either source or test, so the sources exclude the test patterns.
sonar.exclusions=\
  **/*_test.go,\
  **/testdata/**

# The coverage report holds Go only.
sonar.coverage.exclusions=\
  **/*.sh

# Terraform here is test data and the repository settings in infra/github.
sonar.terraform.activate=false

# Cognitive complexity (S3776) and duplicated string literals (S1192) are accepted.
sonar.issue.ignore.multicriteria=goS3776,goS1192,shellS1192,githubactionsS1192,dockerS1192,\
  devKeyRoot,\
  devKeyLocal,\
  devKeyMinikube,\
  githubAppRs256,\
  mockGithubAppRs256,\
  dockerWorldWritable,\
  dockerCopyOwner,\
  dockerCurlRedirect,\
  testaccGitPath,\
  testaccSshGitPath,\
  testaccToxiproxyHttp,\
  releaserGitPath
sonar.issue.ignore.multicriteria.goS3776.ruleKey=go:S3776
sonar.issue.ignore.multicriteria.goS3776.resourceKey=**/*
sonar.issue.ignore.multicriteria.goS1192.ruleKey=go:S1192
sonar.issue.ignore.multicriteria.goS1192.resourceKey=**/*
sonar.issue.ignore.multicriteria.shellS1192.ruleKey=shell:S1192
sonar.issue.ignore.multicriteria.shellS1192.resourceKey=**/*
sonar.issue.ignore.multicriteria.githubactionsS1192.ruleKey=githubactions:S1192
sonar.issue.ignore.multicriteria.githubactionsS1192.resourceKey=**/*
sonar.issue.ignore.multicriteria.dockerS1192.ruleKey=docker:S1192
sonar.issue.ignore.multicriteria.dockerS1192.resourceKey=**/*

# The dev configs hold the private key of meshfed-release's dev dump.
sonar.issue.ignore.multicriteria.devKeyRoot.ruleKey=secrets:S6706
sonar.issue.ignore.multicriteria.devKeyRoot.resourceKey=runner-config.yml
sonar.issue.ignore.multicriteria.devKeyLocal.ruleKey=secrets:S6706
sonar.issue.ignore.multicriteria.devKeyLocal.resourceKey=dev/local.yml
sonar.issue.ignore.multicriteria.devKeyMinikube.ruleKey=secrets:S6706
sonar.issue.ignore.multicriteria.devKeyMinikube.resourceKey=dev/minikube.yml

# GitHub requires RS256, which is PKCS #1 v1.5, for a GitHub App token.
sonar.issue.ignore.multicriteria.githubAppRs256.ruleKey=go:S5542
sonar.issue.ignore.multicriteria.githubAppRs256.resourceKey=internal/executor/github/appjwt.go
sonar.issue.ignore.multicriteria.mockGithubAppRs256.ruleKey=go:S5542
sonar.issue.ignore.multicriteria.mockGithubAppRs256.resourceKey=internal/testacc/mockgithub/app.go

# The non-root user owns /app and adds CA certificates; the nix installer is checked by its sha256.
sonar.issue.ignore.multicriteria.dockerWorldWritable.ruleKey=docker:S2612
sonar.issue.ignore.multicriteria.dockerWorldWritable.resourceKey=containers/Dockerfile
sonar.issue.ignore.multicriteria.dockerCopyOwner.ruleKey=docker:S6504
sonar.issue.ignore.multicriteria.dockerCopyOwner.resourceKey=containers/Dockerfile
sonar.issue.ignore.multicriteria.dockerCurlRedirect.ruleKey=docker:S6506
sonar.issue.ignore.multicriteria.dockerCurlRedirect.resourceKey=containers/Dockerfile

# The acceptance harness runs git and toxiproxy locally.
sonar.issue.ignore.multicriteria.testaccGitPath.ruleKey=go:S4036
sonar.issue.ignore.multicriteria.testaccGitPath.resourceKey=internal/testacc/harness/git.go
sonar.issue.ignore.multicriteria.testaccSshGitPath.ruleKey=go:S4036
sonar.issue.ignore.multicriteria.testaccSshGitPath.resourceKey=internal/testacc/sshgit/session.go
sonar.issue.ignore.multicriteria.testaccToxiproxyHttp.ruleKey=go:S5332
sonar.issue.ignore.multicriteria.testaccToxiproxyHttp.resourceKey=internal/testacc/toxiproxy/proxy.go

# The release notes tool runs git locally.
sonar.issue.ignore.multicriteria.releaserGitPath.ruleKey=go:S4036
sonar.issue.ignore.multicriteria.releaserGitPath.resourceKey=tools/releaser/git.go
